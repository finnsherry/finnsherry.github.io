<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Generator</title>
    <link rel="icon" href="/content/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
    <style>
        * { box-sizing: border-box; }

        .machine {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.2em;
            padding: 1.5em 1.2em 1.2em;
            margin: 1.5em auto;
            width: min(95%, calc(0.8*1080px));
            text-align: center;
            background:
                radial-gradient(ellipse at 25% 0%, #fff6 0%, transparent 45%),
                linear-gradient(160deg, #f6cd55 0%, #d18a1e 45%, #8f4708 100%);
            border: 6px solid;
            border-color: #ffe9a0 #b06a12 #6e3604 #f0c25a;
            border-radius: 34px 34px 22px 22px;
            box-shadow:
                0 20px 50px #000a,
                inset 0 2px 0 #fffa,
                inset 0 -10px 24px #0006,
                inset 0 0 0 2px #7a3e06;
        }

        /* Light-up sign */
        .marquee {
            width: 100%;
            padding: 0.2em 0.6em;
            background: linear-gradient(#b3162f, #5e0716);
            border: 4px solid #ffdf79;
            border-radius: 16px;
            box-shadow: inset 0 0 18px #000a, 0 4px 0 #6e3604;
        }

        .marquee h2 {
            margin: 0.1em 0;
            font-size: clamp(1.1em, 4.5vw, 1.8em);
            letter-spacing: 0.06em;
            color: #fff7d0;
            text-shadow: 0 0 6px #ffcf4d, 0 0 16px #ff8a00, 2px 3px 2px #3a0008;
        }

        .bulbs {
            display: flex;
            justify-content: space-between;
            padding: 0.35em 0.2em;
        }

        .bulbs span {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: bulb 1s steps(1) infinite;
        }

        .bulbs span:nth-child(odd) {
            animation-name: bulb-alt;
        }

        .machine.spinning .bulbs span {
            animation-duration: 0.25s;
        }

        .machine.win .bulbs span {
            animation: chase 0.45s steps(1) infinite;
            animation-delay: calc(var(--i) * -0.15s);
        }

        @keyframes bulb {
            0% { background: #fff6b0; box-shadow: 0 0 6px 2px #ffd34d, 0 0 14px #ffae00; }
            50% { background: #6b4a12; box-shadow: inset 0 -2px 3px #0008; }
        }

        @keyframes bulb-alt {
            0% { background: #6b4a12; box-shadow: inset 0 -2px 3px #0008; }
            50% { background: #fff6b0; box-shadow: 0 0 6px 2px #ffd34d, 0 0 14px #ffae00; }
        }

        @keyframes chase {
            0% { background: #fff; box-shadow: 0 0 8px 3px #fff27a, 0 0 18px #ff5ec4; }
            33% { background: #6b4a12; box-shadow: inset 0 -2px 3px #0008; }
        }

        /* Reel window */
        .wheels {
            position: relative;
            display: flex;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px;
            background: linear-gradient(#141019, #2d2540 50%, #141019);
            border: 5px solid;
            border-color: #6e3604 #ffe9a0 #ffe9a0 #6e3604;
            border-radius: 18px;
            box-shadow: inset 0 0 25px #000, 0 0 0 3px #7a3e06;
        }

        /* Payline markers */
        .wheels::before,
        .wheels::after {
            content: "";
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            border: 9px solid transparent;
            filter: drop-shadow(0 0 4px #ff2244);
        }

        .wheels::before {
            left: -3px;
            border-left: 13px solid #e8213f;
        }

        .wheels::after {
            right: -3px;
            border-right: 13px solid #e8213f;
        }

        .wheel {
            position: relative;
            flex: 1;
            min-width: 0;
            height: 8em;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(#a9a3bd, #fff 24%, #fff 76%, #a9a3bd);
            color: #27213c;
            border: 2px solid #000a;
            border-radius: 8px;
            font-size: clamp(14px, 3.6vw, 24px);
            font-weight: 900;
            text-transform: uppercase;
            transition: box-shadow 0.3s;
        }

        /* Curved-glass shading over the reel */
        .wheel::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(170deg, #fff9 0%, transparent 30%),
                linear-gradient(#0008, transparent 28%, transparent 72%, #0008);
        }

        .wheel span {
            display: block;
            text-align: center;
            overflow-wrap: anywhere;
            padding: 4px;
        }

        .wheel.spinning span {
            animation: blur 0.12s linear infinite;
        }

        .wheel.landed span {
            animation: land 0.4s cubic-bezier(0.3, 1.8, 0.5, 1);
        }

        .machine.win .wheel {
            animation: win-glow 0.4s ease-in-out 6 alternate;
        }

        @keyframes blur {
            0% { transform: translateY(-15px); filter: blur(3px); }
            50% { transform: translateY(15px); filter: blur(1px); }
            100% { transform: translateY(-15px); filter: blur(3px); }
        }

        @keyframes land {
            0% { transform: translateY(-60%); filter: blur(2px); }
            100% { transform: none; filter: none; }
        }

        @keyframes win-glow {
            from { box-shadow: 0 0 0 0 #ffd34d00; }
            to { box-shadow: 0 0 14px 4px #ffd34d; }
        }

        /* LED status display */
        .display {
            min-width: min(100%, 18em);
            padding: 0.35em 1em;
            background: #120a05;
            border: 3px solid #5a2d04;
            border-radius: 8px;
            box-shadow: inset 0 0 12px #000, 0 1px 0 #ffe9a0;
        }

        #message {
            font-family: "Courier New", Courier, monospace;
            font-size: 1.1em;
            font-weight: bold;
            letter-spacing: 0.15em;
            color: #ffa43a;
            text-shadow: 0 0 6px #ff6a00, 0 0 14px #ff3c00;
        }

        .machine.win #message {
            animation: flash 0.3s steps(1) infinite;
        }

        @keyframes flash {
            50% { color: #fff6b0; text-shadow: 0 0 8px #ffd34d, 0 0 18px #ff8a00; }
        }

        /* Spin button */
        .machine table {
            border-collapse: collapse;
        }

        .spin-button {
            padding: 0.8em 2.4em;
            border: 3px solid #ffc2cb;
            border-radius: 50px;
            background: radial-gradient(ellipse at 50% 20%, #ff8a99, #e3193a 55%, #9c0a20);
            color: #fff;
            font-size: 1.3em;
            font-weight: 900;
            letter-spacing: 0.1em;
            text-shadow: 0 2px 2px #6a0012;
            cursor: pointer;
            box-shadow: 0 6px 0 #6a0012, 0 10px 20px #0006;
            animation: invite 1.6s ease-in-out infinite;
        }

        .spin-button:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #6a0012;
        }

        .spin-button:disabled {
            filter: saturate(0.4) brightness(0.85);
            cursor: wait;
            animation: none;
        }

        @keyframes invite {
            50% { box-shadow: 0 6px 0 #6a0012, 0 10px 20px #0006, 0 0 22px 4px #ff4d6a; }
        }

        /* Coin tray */
        .coin-tray {
            width: 70%;
            height: 24px;
            background: linear-gradient(#1c1006, #5a3510);
            border: 3px solid #6e3604;
            border-top: none;
            border-radius: 0 0 40px 40px / 0 0 24px 24px;
            box-shadow: inset 0 8px 10px #000c, 0 2px 0 #ffe9a0;
        }

        /* Side lever, only when there is room next to the machine */
        .lever {
            display: none;
            position: absolute;
            left: 100%;
            top: 22%;
            width: 48px;
            height: 170px;
            cursor: pointer;
        }

        @media (min-width: 1040px) {
            .lever { display: block; }
        }

        .lever-stick {
            position: absolute;
            left: 20px;
            top: 26px;
            width: 8px;
            height: 121px;
            background: linear-gradient(90deg, #888, #fff 40%, #999);
            border-radius: 4px;
            transform-origin: 50% 100%;
        }

        .lever-mount {
            position: absolute;
            left: 0;
            top: 124px;
            width: 34px;
            height: 46px;
            background: linear-gradient(#ffe9a0, #d18a1e 50%, #8f4708);
            border-radius: 0 14px 14px 0;
            box-shadow: 2px 4px 8px #0007;
        }

        .lever-knob {
            position: absolute;
            left: 10px;
            top: 8px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #ff9aa8, #e3193a 50%, #7a0616);
            box-shadow: 0 3px 6px #0007;
        }

        .lever.pulled .lever-stick { animation: pull-stick 0.7s ease-in-out; }
        .lever.pulled .lever-knob { animation: pull-knob 0.7s ease-in-out; }

        @keyframes pull-stick {
            40% { transform: scaleY(-1); }
        }

        @keyframes pull-knob {
            20% { transform: translateY(125px) scale(1.35); }
            40% { transform: translateY(250px) scale(1); }
            70% { transform: translateY(125px) scale(1.35); }
        }

        @media (prefers-reduced-motion: reduce) {
            .bulbs span,
            .machine.win .bulbs span,
            .spin-button {
                animation: none;
            }
            .bulbs span {
                background: #fff6b0;
                box-shadow: 0 0 6px 2px #ffd34d;
            }
        }
    </style>
    <script type="module" src='main.js' defer></script>
    <link rel="stylesheet" href="/utils/katex/katex.min.css">
    <script defer src="/utils/katex/katex.min.js"></script>
    <script defer src="/utils/katex/contrib/auto-render.min.js" onload="renderMathInElement(document.body);"></script>
</head>

<body>
    <header>
        <div id="nav">
            <a class="navlink" href="/">Home</a>
            <a class="navlink" href="/publications">Publications</a>
            <!-- <a class="navlink" href="/teaching">Teaching</a> -->
            <a class="navlink" href="/curiosa">Curiosa</a>
        </div>
        <a id="home" href="/">Finn Sherry</a>
        <button id="colourbutton">
            🌙
        </button>
        <button id="navbutton" onclick="toggleNav()">
            •••
        </button>
        <script>
            function toggleNav() {
                document.getElementById("nav").classList.toggle('expand')
            }

            const root = document.documentElement;
            const storedScheme = localStorage.getItem('scheme');
            const colourButton = document.getElementById("colourbutton");
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const scheme = storedScheme || (prefersDark ? 'dark' : 'light');

            applyScheme(scheme);

            colourButton.addEventListener("click", () => {
                const current = root.dataset.scheme === 'dark' ? 'dark' : 'light';
                const next = current === 'dark' ? 'light' : 'dark';
                applyScheme(next);
                localStorage.setItem('scheme', next);
            });

            function applyScheme(scheme) {
                root.dataset.scheme = scheme
                colourButton.textContent = scheme === "dark" ? "☀️" : "🌙";
            }
        </script>
    </header>

    <main>
        <div class="content-container">
            <h1>Project Generator</h1>
            In the future, <s>entertainment</s> projects will be randomly generated.

            <div class="machine">
                <div class="marquee">
                    <div class="bulbs"></div>
                    <h2>🎰 PROJECT GENERATOR 🎰</h2>
                    <div class="bulbs"></div>
                </div>
                <div class="wheels">
                    <div class="wheel"><span>READY</span></div>
                    <div class="wheel"><span>READY</span></div>
                    <div class="wheel"><span>READY</span></div>
                </div>
                <div class="display"><span id="message">READY TO SPIN</span></div>
                <div class="coin-tray"></div>
                <div class="lever" aria-hidden="true">
                    <div class="lever-stick"></div>
                    <div class="lever-mount"></div>
                    <div class="lever-knob"></div>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
