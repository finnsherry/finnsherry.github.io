<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Generator</title>
    <link rel="icon" href="/content/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
    <style>
        * { box-sizing: border-box; }

        h2 {
            margin: 0;
            font-size: 1.8em;
            color: #fff7d0;
            text-shadow: 2px 3px 4px #6a3100;
        }

        .machine {
            text-align: center;
            display: flex;
            flex-direction: column;
            padding: 2em 1em;
            margin: 1em auto;
            width: min(95%, calc(0.8*1080px));
            background: linear-gradient(145deg, #edb83d, #a65b0d);
            border: 5px solid #ffdf79;
            border-radius: 30px;
            box-shadow: 0 15px 50px #0009, inset 0 0 15px #fff8;
        }

        .wheels {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 18px 10px;
            margin: 1em;
            background: #231d30;
            border: 4px solid #ffdf79;
            border-radius: 18px;
            box-shadow: inset 0 0 20px #000;
        }

        .wheel {
            width: 30%;
            height: 8em;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(#fff, #e8e8f3);
            color: #27213c;
            border: 3px solid #c5a8ff;
            border-radius: 12px;
            font-size: clamp(15px, 3.8vw, 25px);
            font-weight: bold;
            box-shadow: inset 0 0 12px #7775;
            text-transform: uppercase;
        }

        .wheel span {
            display: block;
            text-align: center;
            overflow-wrap: anywhere;
            padding: 4px;
        }

        .wheel.spinning span {
            animation: blur 0.12s linear infinite;
        }

        @keyframes blur {
            0% { transform: translateY(-15px); filter: blur(3px); }
            50% { transform: translateY(15px); filter: blur(1px); }
            100% { transform: translateY(-15px); filter: blur(3px); }
        }
        
        .spin-button {
            padding: 1em 2em;
            border: 3px solid #fff2a0;
            border-radius: 50px;
            background: linear-gradient(#ffed64, #ff9f00);
            color: #542900;
            font-size: 1.3em;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 6px 0 #985200, 0 10px 20px #0005;
        }

        .spin-button:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #985200;
        }

        .spin-button:disabled {
            opacity: 0.7;
            cursor: wait;
        }

        #message {
            min-height: 28px;
            margin-top: 25px;
            font-size: 20px;
            font-weight: bold;
            color: #fff6bd;
        }
    </style>
    <script type="module" src='main.js' defer></script>
    <link rel="stylesheet" href="/utils/katex/katex.min.css">
    <script defer src="/utils/katex/katex.min.js"></script>
    <script defer src="/utils/katex/contrib/auto-render.min.js" onload="renderMathInElement(document.body);"></script>
</head>

<body>
    <header>
        <div id="nav">
            <a class="navlink" href="/">Home</a>
            <a class="navlink" href="/publications">Publications</a>
            <!-- <a class="navlink" href="/teaching">Teaching</a> -->
            <a class="navlink" href="/curiosa">Curiosa</a>
        </div>
        <a id="home" href="/">Finn Sherry</a>
        <button id="colourbutton">
            🌙
        </button>
        <button id="navbutton" onclick="toggleNav()">
            •••
        </button>
        <script>
            function toggleNav() {
                document.getElementById("nav").classList.toggle('expand')
            }

            const root = document.documentElement;
            const storedScheme = localStorage.getItem('scheme');
            const colourButton = document.getElementById("colourbutton");
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const scheme = storedScheme || (prefersDark ? 'dark' : 'light');

            applyScheme(scheme);

            colourButton.addEventListener("click", () => {
                const current = root.dataset.scheme === 'dark' ? 'dark' : 'light';
                const next = current === 'dark' ? 'light' : 'dark';
                applyScheme(next);
                localStorage.setItem('scheme', next);
            });

            function applyScheme(scheme) {
                root.dataset.scheme = scheme
                colourButton.textContent = scheme === "dark" ? "☀️" : "🌙";
            }
        </script>
    </header>

    <main>
        <div class="content-container">
            <h1>Project Generator</h1>
            In the future, <s>entertainment</s> projects will be randomly generated.

            <div class="machine">
                <h2>🎰 PROJECT GENERATOR 🎰</h2>
                <div class="wheels">
                    <div class="wheel"><span>READY</span></div>
                    <div class="wheel"><span>READY</span></div>
                    <div class="wheel"><span>READY</span></div>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
